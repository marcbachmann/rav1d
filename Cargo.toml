[workspace]
members = [".", "tools"]
default-members = [".", "tools"]

[workspace.dependencies]
cc = "1.0.79"
cfg-if = "1.0.0"
libc = "0.2"

[package]
name = "rav1d"
authors = ["Rav1d Developers", "Prossimo"]
version = "1.1.0"
edition = "2021"
rust-version = "1.79"
description = "Rust port of the dav1d AV1 decoder"
license = "BSD-2-Clause"
repository = "https://github.com/memorysafety/rav1d"
exclude = ["*.c", "*.h", "*.in", "meson*", "tests/", "doc/"]

[dependencies]
assert_matches = "1.5.0"
atomig = { version = "0.4.0", features = ["derive"] }
av-data = "0.4.2"
bitflags = "2.4.0"
cfg-if.workspace = true
libc.workspace = true
parking_lot = "0.12.2"
paste = "1.0.14"
static_assertions = "1.1.0"
strum = { version = "0.27", features = ["derive"] }
to_method = "1.1.0"
zerocopy = { version = "0.7.32", features = ["derive"] }

[target.'cfg(any(target_arch = "x86", target_arch = "x86_64"))'.dependencies]
raw-cpuid = "11.0.1"

[features]
default = ["bitdepth_8", "bitdepth_16"]
bitdepth_8 = []
bitdepth_16 = []
encoder = []
# The dav1d-compatible `dav1d_*` functions, for the CLI and its tests; the library's API is `rust_api`.
capi = []

[[test]]
name = "decode_rows"
required-features = ["capi"]

[[test]]
name = "uninit"
required-features = ["capi"]

[profile.dev]
panic = "abort"

[profile.opt-dev]
# The debug builds run tests very slowly so this profile keeps debug assertions
# while enabling basic optimizations. The profile is not suitable for debugging.
inherits = "dev"
opt-level = 1

[profile.release]
codegen-units = 1
panic = "abort"
lto = "fat"

[profile.release-with-debug]
inherits = "release"
debug = "line-tables-only"

[profile.checked-release]
# Close to a release build, but with all checks enabled.
inherits = "dev"
opt-level = 2
codegen-units = 16

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(rav1d_itx_bisect)'] }
