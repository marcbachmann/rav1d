name: build and test on aarch64 linux
on:
  push:
    branches:
      - 'main'
  pull_request:
jobs:
  test-on-ubuntu-arm:
    strategy:
      matrix:
        # Test with negative strides, threads and framedelay
        variant: [
          "",
          "-n",
          "-f 1",
          "-f 2"
        ]
    runs-on: ubuntu-24.04-arm
    steps:
      - name: refresh apt package lists
        run: sudo apt-get update
      - name: install prerequisites
        run: sudo apt-get install -y meson
      - name: git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: install rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable # aarch64 feature detection is stable
          components: clippy
      - name: cache rust dependencies
        uses: Swatinem/rust-cache@v2
      - name: cargo build release
        run: cargo +${{ steps.toolchain.outputs.name }} build --release
      - name: Clippy
        run: cargo +${{ steps.toolchain.outputs.name }} clippy -- -D warnings
      - name: cargo test lib
        if: ${{ matrix.variant == '' }}
        run: cargo +${{ steps.toolchain.outputs.name }} test --release --lib
      - name: meson test
        run: |
          .github/workflows/test.sh \
              -r target/release/dav1d \
              -s target/release/seek_stress \
              -t 1 \
              ${{ matrix.variant }}
      - name: upload build artifacts
        if: ${{ !cancelled() && matrix.variant == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: meson-test-logs-aarch64-unknown-linux-gnu
          path: |
             ${{ github.workspace }}/build/meson-logs/testlog.txt
